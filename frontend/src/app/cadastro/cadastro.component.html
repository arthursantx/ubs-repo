<h1>Cadastro</h1>

<label for="id">ID:</label>
<input type="number" id="id" [(ngModel)]="obj.id" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="nome">Nome:</label>
<input type="text" id="nome" [(ngModel)]="obj.nome" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="cpf">CPF:</label>
<input type="text" id="cpf" [(ngModel)]="obj.cpf" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="nomeSocial">Nome Social:</label>
<input type="text" id="nomeSocial" [(ngModel)]="obj.nomeSocial" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="nomeMae">Nome da Mãe:</label>
<input type="text" id="nomeMae" [(ngModel)]="obj.nomeMae" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="dataNascimento">Data de Nascimento:</label>
<input type="date" id="dataNascimento" [(ngModel)]="obj.dataNascimento" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="sexo">Sexo:</label>
<select id="sexo" [(ngModel)]="obj.sexo" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
    <option value="outro">Outro</option>
</select><br>

<label for="nacionalidade">Nacionalidade:</label>
<input type="text" id="nacionalidade" [(ngModel)]="obj.nacionalidade" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="municipioNascimento">Município de Nascimento:</label>
<input type="text" id="municipioNascimento" [(ngModel)]="obj.municipioNascimento" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="racaCor">Raça/COR:</label>
<input type="text" id="racaCor" [(ngModel)]="obj.racaCor" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="frequentaEscola">Frequenta Escola:</label>
<select id="frequentaEscola" [(ngModel)]="obj.frequentaEscola" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
    <option value="sim">Sim</option>
    <option value="nao">Não</option>
</select><br>

<label for="escolaridade">Escolaridade:</label>
<input type="text" id="escolaridade" [(ngModel)]="obj.escolaridade" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="situacaoFamiliar">Situação Familiar:</label>
<input type="text" id="situacaoFamiliar" [(ngModel)]="obj.situacaoFamiliar" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="estabele cimentoVinculo">Estabelecimento de Vínculo:</label>
<input type="text" id="estabelecimentoVinculo" [(ngModel)]="obj.estabelecimentoVinculo" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="estabelecimentoCadastro">Estabelecimento de Cadastro:</label>
<input type="text" id="estabelecimentoCadastro" [(ngModel)]="obj.estabelecimentoCadastro" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="deficiencia">Deficiência:</label>
<input type="text" id="deficiencia" [(ngModel)]="obj.deficiencia" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="deficienciaDetalhe">Detalhe da Deficiência:</label>
<input type="text" id="deficienciaDetalhe" [(ngModel)]="obj.deficienciaDetalhe" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="celular">Celular:</label>
<input type="text" id="celular" [(ngModel)]="obj.celular" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="residencial">Telefone Residencial:</label>
<input type="text" id="residencial" [(ngModel)]="obj.residencial" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="comercial">Telefone Comercial:</label>
<input type="text" id="comercial" [(ngModel)]="obj.comercial" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="contato">Contato:</label>
<input type="text" id="contato" [(ngModel)]="obj.contato" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="email">Email:</label>
<input type="email" id="email" [(ngModel)]="obj.email" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="origemEndereco">Origem do Endereço:</label>
<input type="text" id="origemEndereco" [(ngModel)]="obj.origemEndereco" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="endereco">Endereço:</label>
<input type="text" id="endereco" [(ngModel)]="obj.endereco" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<label for="identidade">Identidade:</label>
<input type="text" id="identidade" [(ngModel)]="obj.identidade" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

<button (click)="salvar()" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">
    Salvar
</button>
